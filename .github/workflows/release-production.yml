name: Release production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-production-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      reference: ${{ steps.release.outputs.reference }}
      revision: ${{ steps.metadata.outputs.revision }}
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate release metadata
        id: metadata
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${repository}"
          [[ "$image" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "revision=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.metadata.outputs.image }}:sha-${{ steps.metadata.outputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ steps.metadata.outputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record digest-pinned release
        id: release
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="${IMAGE}@${DIGEST}"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          printf 'Published digest-pinned image: %s\n' "$reference" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy through Tailscale
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Check out the current protected branch tip
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
      - name: Reject an out-of-order deployment
        env:
          RELEASE_REVISION: ${{ needs.publish.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
      - name: Validate deployment configuration
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_TAGS: ${{ vars.TS_TAGS }}
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.PRODUCTION_SSH_HOST_KEYS }}
          RELEASE_REFERENCE: ${{ needs.publish.outputs.reference }}
          RELEASE_REVISION: ${{ needs.publish.outputs.revision }}
        run: |
          set -euo pipefail
          test -n "$TS_CLIENT_ID"
          test -n "$TS_CLIENT_SECRET"
          test -n "$TS_TAGS"
          test -n "$SSH_HOST"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST_KEYS"
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "${SSH_PORT:-22}" =~ ^[0-9]{1,5}$ ]]
          (( ${SSH_PORT:-22} >= 1 && ${SSH_PORT:-22} <= 65535 ))
          [[ "$RELEASE_REFERENCE" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
      - name: Join the tailnet
        uses: tailscale/github-action@84a3f23bb4d843bcf4da6cf824ec1be473daf4de # v3.2.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: ${{ vars.TS_TAGS }}
      - name: Install ephemeral SSH material
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.PRODUCTION_SSH_HOST_KEYS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$SSH_HOST_KEYS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/ssh/deploy_key" >/dev/null
          ssh-keygen -l -f "$RUNNER_TEMP/ssh/known_hosts" >/dev/null
      - name: Dispatch digest-pinned deployment
        env:
          SSH_HOST: ${{ vars.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ vars.PRODUCTION_SSH_PORT }}
          RELEASE_REFERENCE: ${{ needs.publish.outputs.reference }}
          RELEASE_REVISION: ${{ needs.publish.outputs.revision }}
        run: |
          set -euo pipefail
          ssh -T \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -p "${SSH_PORT:-22}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -- "deploy@${SSH_HOST}" \
            "deploy ${RELEASE_REFERENCE} ${RELEASE_REVISION}"
          printf 'Deployed digest-pinned image: %s\n' "$RELEASE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
